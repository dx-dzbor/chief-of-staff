<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title description" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="title">Personal OS chief of staff loop</title>
  <desc id="description">Markdown context feeds five skills. They create a morning brief, capture and review the day, audit follow-through, draft weekly status, and explain topics visually. Debriefed facts and decisions feed the next brief.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#4965a5" stroke-width="1.5"/></marker>
    <marker id="loop-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#a16a22" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="480" rx="20" fill="#f8f9fc"/>
  <text x="480" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#152039">Your context becomes the next clear action</text>
  <text x="480" y="65" text-anchor="middle" font-size="13" fill="#56647c">Plain markdown · five skills · no required connectors</text>

  <rect x="38" y="95" width="246" height="286" rx="15" fill="#eaf0ff" stroke="#b7c9f3"/>
  <text x="60" y="128" font-size="17" font-weight="700" fill="#183c81">Your context</text>
  <text x="60" y="151" font-size="12" fill="#536a9a">Current state in me/</text>
  <g fill="#fff" stroke="#cfdbf5">
    <rect x="56" y="171" width="210" height="39" rx="8"/><rect x="56" y="221" width="210" height="39" rx="8"/><rect x="56" y="271" width="210" height="39" rx="8"/><rect x="56" y="321" width="210" height="39" rx="8"/>
  </g>
  <g font-size="13" fill="#22385f"><text x="72" y="196">Drive and weekly goals</text><text x="72" y="246">Projects and people</text><text x="72" y="296">Decisions and waiting-on</text><text x="72" y="346">Dated update history</text></g>

  <path d="M291 238 H332" stroke="#4965a5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="344" y="95" width="244" height="286" rx="15" fill="#f1ecff" stroke="#d2c4f5"/>
  <text x="366" y="128" font-size="17" font-weight="700" fill="#593796">Chief of staff</text>
  <text x="366" y="151" font-size="12" fill="#765ca7">Reads what the task needs</text>
  <g fill="#fff" stroke="#ded3f4">
    <rect x="362" y="171" width="208" height="35" rx="8"/><rect x="362" y="212" width="208" height="35" rx="8"/><rect x="362" y="253" width="208" height="35" rx="8"/><rect x="362" y="294" width="208" height="35" rx="8"/><rect x="362" y="335" width="208" height="35" rx="8"/>
  </g>
  <g font-size="13" fill="#3d2b66"><text x="378" y="194">/brief</text><text x="378" y="235">/debrief</text><text x="378" y="276">/os-review</text><text x="378" y="317">/weekly-status</text><text x="378" y="358">/eli5</text></g>

  <path d="M595 238 H636" stroke="#4965a5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="648" y="95" width="274" height="286" rx="15" fill="#e9f7ef" stroke="#b9e3c9"/>
  <text x="670" y="128" font-size="17" font-weight="700" fill="#1d6842">Useful outputs</text>
  <text x="670" y="151" font-size="12" fill="#56836a">Actions, drafts, and diagrams</text>
  <g fill="#fff" stroke="#ccebd8">
    <rect x="666" y="171" width="238" height="35" rx="8"/><rect x="666" y="212" width="238" height="35" rx="8"/><rect x="666" y="253" width="238" height="35" rx="8"/><rect x="666" y="294" width="238" height="35" rx="8"/><rect x="666" y="335" width="238" height="35" rx="8"/>
  </g>
  <g font-size="13" fill="#214f37"><text x="682" y="194">Today’s priority and follow-ups</text><text x="682" y="235">Captured facts; changes reviewed</text><text x="682" y="276">Overdue checkpoints</text><text x="682" y="317">Weekly status draft</text><text x="682" y="358">Visual HTML explainer</text></g>

  <path d="M785 388 V417 Q785 439 758 439 H168 Q139 439 139 411 V390" fill="none" stroke="#a16a22" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#loop-arrow)"/>
  <rect x="306" y="416" width="348" height="31" rx="15" fill="#fff7e8"/>
  <text x="480" y="437" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5b1c">Debrief feeds tomorrow’s brief</text>
  <text x="480" y="468" text-anchor="middle" font-size="11" fill="#657188">Decisions stay visible until their next checkpoint.</text>
</svg>
